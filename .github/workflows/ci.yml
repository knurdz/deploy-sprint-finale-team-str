# AI-REVIEW-MARKER: participant must manually remove this marker
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: npm run build
        working-directory: team-site

      - name: Generate Release Manifest
        run: |
          node -e "
          const fs = require('fs');
          const sha = process.env.GITHUB_SHA || '';
          const runId = process.env.GITHUB_RUN_ID || '';
          const artifactId = 'site-dist-' + sha;
          const manifest = {
            task: 'T23',
            tasks: ['T23'],
            commit: sha,
            workflowRun: runId,
            deployedAt: new Date().toISOString(),
            artifact: artifactId,
            image: artifactId,
            identifier: artifactId
          };
          fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2));
          if (!fs.existsSync('team-site/dist')) {
            fs.mkdirSync('team-site/dist', { recursive: true });
          }
          fs.writeFileSync('team-site/dist/release-manifest.json', JSON.stringify(manifest, null, 2));
          fs.writeFileSync('team-site/dist/status.json', JSON.stringify(manifest, null, 2));
          fs.mkdirSync('team-site/dist/status', { recursive: true });
          fs.writeFileSync('team-site/dist/status/index.html', JSON.stringify(manifest, null, 2));
          console.log('Release manifest generated successfully:', manifest);
          "

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

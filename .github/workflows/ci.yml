name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        working-directory: team-site
        run: npm ci

      - name: Build
        working-directory: team-site
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: npm run build

      - name: Create health endpoint
        run: |
          mkdir -p team-site/dist/health
          echo "ok" > team-site/dist/health/index.html

      - name: Create status endpoint
        run: |
          cat <<EOF > team-site/dist/status
          {
            "team": "str",
            "commit": "${{ github.sha }}",
            "task": "T05",
            "public_url_configured": true,
            "secrets_redacted": true,
            "config_source": "GitHub Secrets"
          }
          EOF

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist
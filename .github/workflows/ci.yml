
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          cp .env.example .env
          docker compose config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        working-directory: team-site
        run: npm ci

      - name: Build
        working-directory: team-site
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: npm run build

      - name: Create health endpoint
        run: |
          rm -f team-site/dist/health
          mkdir -p team-site/dist/health
          echo "ok" > team-site/dist/health/index.html

      - name: Create status endpoint
        run: |
          cat <<EOF > team-site/dist/status
          {
            "team": "str",
            "commit": "${{ github.sha }}",
            "task": "T05",
            "public_url_configured": true,
            "secrets_redacted": true,
            "config_source": "GitHub Secrets"
          }
          EOF

      - name: Generate Release Manifest
        run: |
          node -e "
          const fs = require('fs');
          const sha = process.env.GITHUB_SHA || '';
          const runId = process.env.GITHUB_RUN_ID || '';
          const artifactId = 'site-dist-' + sha;

          const manifest = {
            task: 'T23',
            tasks: ['T23'],
            commit: sha,
            workflowRun: runId,
            deployedAt: new Date().toISOString(),
            artifact: artifactId,
            image: artifactId,
            identifier: artifactId
          };

          fs.writeFileSync(
            'release-manifest.json',
            JSON.stringify(manifest, null, 2)
          );

          if (!fs.existsSync('team-site/dist')) {
            fs.mkdirSync('team-site/dist', { recursive: true });
          }

          fs.writeFileSync(
            'team-site/dist/release-manifest.json',
            JSON.stringify(manifest, null, 2)
          );

          fs.writeFileSync(
            'team-site/dist/status.json',
            JSON.stringify(manifest, null, 2)
          );

          if (fs.existsSync('team-site/dist/status')) {
            let statusContent = fs.readFileSync(
              'team-site/dist/status',
              'utf8'
            );

            statusContent +=
              '\n\nRelease Manifest:\n' +
              JSON.stringify(manifest, null, 2);

            fs.writeFileSync(
              'team-site/dist/status',
              statusContent
            );
          }

          console.log(
            'Release manifest generated successfully:',
            manifest
          );
          "

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

      - name: Build container image
        run: |
          docker build -t deploy-sprint/team-site:$GITHUB_SHA team-site

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist
